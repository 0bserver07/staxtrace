[workspace]
resolver = "2"
members = ["crates/*", "parity"]

# Versions are maintainer-only (CLAUDE.md / AGENTS.md, and docs/specs/rust-port.md
# §5 restates it for this branch). The 0.0.0 freeze held for the whole port
# campaign; the maintainer lifted it on 2026-08-23 for the first Rust release.
# It stays maintainer-only: no agent moves this line without their word.
[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.45", features = ["derive"] }
# DEVIATION from docs/specs/rust-port.md §3, which asks for
# features = ["bundled", "fts5"]: rusqlite has no `fts5` feature (its full list
# is bundled / vtab / series / window / …). FTS5 arrives with `bundled`, which
# compiles libsqlite3-sys with SQLITE_ENABLE_FTS5. Asserted rather than assumed
# — see stax-core's `the_bundled_engine_has_fts5_compiled_in` test.
rusqlite = { version = "0.40.1", features = ["bundled"] }
# preserve_order: the §6 byte-parity decision (key order is the contract).
# float_roundtrip: closes the 1-ULP CPython parse divergence the golden runner
# caught (three goldens broke without it) — declared HERE so member crates can
# never be correct only by accident of feature unification (wave 9's reduced
# member set would silently lose it otherwise).
serde_json = { version = "1.0.145", features = ["preserve_order", "float_roundtrip"] }
stax-core = { path = "crates/stax-core" }
stax-memory = { path = "crates/stax-memory" }

[profile.release]
lto = true
codegen-units = 1

# RP-139: avoid SQLx's unused SQLite driver's native-library conflict with
# staxtrace's rusqlite. These dependency-only copies keep upstream source and
# versions intact; scripts/test_rigwright_durable_work_vendor.py verifies them.
[patch.crates-io]
sqlx = { path = "../vendor/sqlx-postgres-only/sqlx-0.8.6" }
sqlx-macros-core = { path = "../vendor/sqlx-postgres-only/sqlx-macros-core-0.8.6" }

# Avoid the macOS 27 LINKEDIT alignment failure in stripped proc-macro dylibs.
# Only this feature's macro is affected; default staxtrace artifacts are unchanged.
[profile.dev.package.sqlx-macros]
debug = "line-tables-only"
strip = "none"
