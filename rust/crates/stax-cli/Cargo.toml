[package]
name = "stax-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository = "https://github.com/0bserver07/staxtrace"

# cargo-binstall resolves prebuilt release artifacts instead of compiling:
#   cargo binstall --git https://github.com/0bserver07/staxtrace stax-cli
# The templates must keep matching the release workflow's artifact naming
# (staxtrace-v<tag>-<triple>.tar.gz with a versioned top-level directory).
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/staxtrace-v{ version }-{ target }.tar.gz"
bin-dir = "staxtrace-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[[bin]]
name = "stax"
path = "src/main.rs"

# The telephone differ's Rust probe. Same placement rule as `stax-sync-parity`
# and `stax-etl`'s four: the harness lives in the crate it measures, so
# `cargo test -p stax-cli` and the differ can never be built against different
# code. It links nothing new — `stax-core` and `stax-sync` are already deps.
[[bin]]
name = "stax-telephone-parity"
path = "src/bin/telephone_parity.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
# The `memory` verbs hand rows straight to the shared envelope contract, so the
# CLI speaks both value models: `stax-core`'s for the store side and
# `serde_json`'s for the wire side. `rusqlite` is here for the connection type
# the verb runners take — the store handle itself still comes from `stax-core`,
# read-only. Declared as path deps rather than in `[workspace.dependencies]`
# because the workspace manifest is the architect's this wave.
rusqlite = { workspace = true, features = ["backup"] }
serde_json = { version = "1.0.145", features = ["preserve_order", "float_roundtrip"] }
# `resume` renders each agent's real invocation from `adapters/capabilities.json`
# — the templates are data, so the loader (not a transcription) is the dependency.
stax-adapters = { path = "../stax-adapters" }
stax-core.workspace = true
stax-memory = { path = "../stax-memory" }
# The `sync` verb group is a thin shell over this crate: `runner::status` /
# `run_push` / `run_pull` and the `age` identity helpers. It also brings `age`
# and its 115 lock entries into the CLI binary — documented in stax-sync's
# manifest, and the reason `stax-hooks` is still a SEPARATE binary (a hook pays
# for what it links at every spawn; a human-run CLI verb does not).
stax-sync = { path = "../stax-sync" }
# WAVE 8 — the spend/report verbs price and aggregate through the SAME functions
# the HTTP surface does. A second `build_report` in this crate is exactly the
# fork the wave-5 service split exists to prevent.
#
# TRANCHE 3 CLOSED TRANCHE 1'S DEVIATION. This line used to read
# `stax-server = { path = "../stax-server" }`, and the comment above it recorded
# the cost honestly: "the CLI binary now links `axum` / `tokio` transitively and
# never serves a byte … the clean fix is a `stax-reports` crate both `stax-cli`
# and `stax-server` depend on; that is a tranche-3 refactor". This is that
# tranche and this is that crate. `stax-cli`'s dependency graph no longer
# contains axum, tokio, tower, tower-http or hyper.
stax-reports = { path = "../stax-reports" }
# `build_report`'s pre-backfill fallback path re-derives cost, and the CLI's
# engine is the MANIFEST one (`cli.py` never calls `use_price_book_store`).
stax-etl = { path = "../stax-etl" }
# WAVE 8 TRANCHE 2 — `hooks install|uninstall|status|repair|run` are thin
# wrappers over the wave-6 sidecar crate: the templates, the handlers and the
# installer live there, exactly as `stackunderflow/hooks/` owns them in Python.
# The standalone `stax-hooks` BINARY stays the hot path Claude Code spawns;
# this dependency is what makes the human-facing verbs exist at all.
stax-hooks = { path = "../stax-hooks" }
# WAVE 7 — `stax start` adds NO dependency, deliberately.
#
# The reference boots uvicorn in-process on a daemon thread, and the obvious
# port would be `stax-server` + `axum` + `tokio` here. That is exactly the edge
# tranche 3 spent a crate (`stax-reports`) removing: "`stax-cli`'s dependency
# graph no longer contains axum, tokio, tower, tower-http or hyper." Re-adding
# it for one verb would undo that in the same wave it landed.
#
# So `start` SPAWNS the `stax-server` binary — the wave-5 deliverable, already
# built and already shipped alongside `stax` — and waits on it, the same
# separate-binary shape `stax-hooks` has for the same reason. Recorded as
# DIV-308; the observable bytes are unchanged, the process tree is not.
# `rusqlite` (already above, with `backup`) covers `start`'s other wave-7 job:
# the FastAPI lifespan's synchronous half, `db.connect` + `schema.apply`.
# WAVE 8 TRANCHE 4 — the skills / docs / recommend family.
#
# `regex`: `skill_synth`'s five detectors are regex-driven (the negation-cue
# alternation, `_PATH_LIKE`, `_ENV_ASSIGN`, `_VOLATILE_LINE`) and
# `mode_recommender._FILE_MENTION_RE` counts file-shaped tokens in a prompt.
# Hand-rolling that alternation would be a bug farm on a matching rule the
# output depends on. Same version `stax-hooks` already pins.
regex = "1.12"
# `sha2`: `pattern_id` is `sha256(signature).hexdigest()[:16]` and it is written
# into every generated SKILL.md's frontmatter, so it is an output, not an
# implementation detail. Already in the lock via `stax-sync`.
#
# `md5` is NOT here: `mode_recommender.hash_features` needs it, no md5 crate is
# vendored, and the campaign builds offline — so it is implemented in
# `mode_rec::md5` against the RFC vectors plus a digest captured from the
# reference CLI.
sha2 = "0.10.9"
ureq = { version = "2", default-features = false, features = ["tls"] }

# Spec 28's D1 engine — `stax audit`.
[dependencies.stax-audit]
path = "../stax-audit"
