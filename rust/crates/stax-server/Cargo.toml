[package]
name = "stax-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The dashboard binary. Named for what it is; the CLI binary lives in
# `stax-cli` and this crate never shells out to it.
[[bin]]
name = "stax-server"
path = "src/bin/stax-server.rs"

[dependencies]
anyhow = { workspace = true }
# 0.8 is the current line and the one whose `{param}` / `{*wildcard}` path
# syntax maps cleanly onto FastAPI's `{param}` / `{param:path}`. 0.7's
# `:param` / `*wildcard` spelling would have made every ported path a
# transliteration instead of a copy.
axum = { version = "0.8.9", default-features = false, features = [
    "http1",
    "query",
    "tokio",
    "tower-log",
] }
clap = { workspace = true }
# WAVE 10 ITEM 2c — the compiled-in `/static` mount needs `ServeDir`'s content
# type, and DIV-058's law is that a MIME table is a resolution, not a literal:
# hand-rolling one here would be a transcription of the very crate the mount
# used to call. ZERO new `[[package]]` stanzas — `tower-http`'s `fs` feature
# already resolved `mime_guess 2.0.5` and `mime 0.3`; this names the version the
# graph had already unified on, exactly as the `futures-core` line below does.
# Measured with `git diff rust/Cargo.lock` after `cargo build -p stax-server`:
# one line, `mime_guess` joining this crate's dependency list.
mime_guess = { version = "2.0.5", default-features = false }
rusqlite = { workspace = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { workspace = true }
stax-core = { workspace = true }
# DEVIATION (batch C, documented): `POST /api/refresh` re-runs the ingest pass,
# and `ingest::run_ingest` takes the adapter registry — `routes/data.py` gets it
# from `stackunderflow.adapters.registered()`. `stax-etl` depends on
# `stax-adapters` but does not re-export `registry::registered`, so there is no
# way to reach it without naming the crate. This adds no new third-party code
# and no new workspace member: `stax-adapters` is already in the lock as a
# transitive dependency of `stax-etl`. The workspace `Cargo.toml` is untouched.
stax-adapters = { path = "../stax-adapters" }
stax-etl = { path = "../stax-etl" }
stax-memory = { path = "../stax-memory" }
# WAVE 8 TRANCHE 3 — the report layer this crate used to own. It moved out so
# `stax-cli` could stop depending on THIS crate (and, transitively, on axum and
# tokio) to build a spend report. `services/mod.rs` re-exports every module that
# moved, so no route module changed. One owner per helper, the wave-5 law: the
# owner is now `stax-reports` and both consumers are peers.
stax-reports = { path = "../stax-reports" }
# `routes/sync.rs` delegates BOTH its endpoints here — `merge::merged_overview`
# (the SQL batch D had to inline because it could not edit this manifest) and
# `runner::status`, which closes DIV-358. One owner per helper, the wave-5 law.
stax-sync = { path = "../stax-sync" }
# `ServiceExt::map_response` — the one-line layer that restores starlette's
# `; charset=utf-8` on `text/*` static responses.
tower = { version = "0.5.2", features = ["util"] }
tokio = { version = "1.52.3", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "signal",
    # `time`: non-test code uses tokio::time (DIV-353 found it declared only
    # under dev-dependencies, surviving on feature unification — the same
    # correctness-by-accident class the workspace serde_json note forbids).
    "time",
] }
# `fs` only: `ServeDir` is the `StaticFiles` mount, and nothing else in this
# crate wants a middleware stack Python does not have.
tower-http = { version = "0.6.7", features = ["fs"] }
# ── APPENDED (SSE mount, DIV-165 → DIV-320). Do not reorder; add below. ──────
#
# The ONE line that mounts `GET /api/live/stream`, and the whole of it.
# `routes/live.rs` needs a value that implements `Stream` so
# `axum::body::Body::from_stream` will take it; the trait lives in this crate
# and Rust 2018+ cannot name a transitive dependency, which is the `E0463` batch
# E recorded. `axum-core` already depends on `futures-core "0.3"` — this pins the
# version the graph had ALREADY resolved (0.3.33), so:
#
#   Cargo.lock delta, measured with `git diff rust/Cargo.lock` after
#   `cargo build -p stax-server`: ONE line — `"futures-core"` joins
#   `stax-server`'s own dependency list. ZERO new `[[package]]` stanzas, ZERO
#   version changes, ZERO extra compilation units (axum-core already builds it).
#   (The package count moved 257 → 258 in the same window; that +1 is the
#   concurrent `stax-reports` crate, visible in the same diff and not ours.)
#
# Deliberately NOT taken, each measured rather than assumed:
#   * `tokio-stream` — would add a real lock entry for `ReceiverStream`, a
#     wrapper this crate can write in nine lines over the public
#     `Receiver::poll_recv`.
#   * `http-body` — implementing `Body` by hand means naming `http_body::Frame`
#     and re-deriving hyper's framing; `from_stream` already does it.
#   * `axum`'s `sse` feature — there is none; the `sse` module is ungated. Its
#     `Event` builder is not used either: it re-encodes the frame, and this port
#     already has `format_sse`, whose bytes are pinned to a recording of the
#     reference. A second encoder is a second thing to keep byte-true.
# Default features (`std`) are the ones the graph already unified on.
futures-core = "0.3.33"

# RP-139: the original binaries and dependencies remain the default build.
# This candidate is vendored byte-for-byte and has no other Rigwright dependency.
deskroost-jobs = { version = "=0.1.0", path = "../../../vendor/rigwright-durable-work/deskroost-jobs-0.1.0", optional = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres"], optional = true }

[features]
rigwright-durable-work = ["dep:deskroost-jobs", "dep:sqlx", "tokio/sync"]

[[bin]]
name = "stax-durable-backfill"
path = "src/bin/stax-durable-backfill.rs"
required-features = ["rigwright-durable-work"]

[dev-dependencies]
tokio = { version = "1.52.3", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
] }
# `ServiceExt::oneshot` — drive the router in-process, so the unit tests need
# no port and can never collide with the reserved :8095 / :8096.
tower = { version = "0.5.2", features = ["util"] }
