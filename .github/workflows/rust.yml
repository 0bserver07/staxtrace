name: Rust

on:
  push:
    branches: [main]
    paths: ['rust/**', '.github/workflows/rust.yml']
  pull_request:
    paths: ['rust/**', '.github/workflows/rust.yml']

jobs:
  test:
    name: workspace (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: fmt
        run: cd rust && cargo fmt --all -- --check
      - name: clippy
        run: cd rust && cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: test
        run: cd rust && cargo test --locked --workspace --all-targets --no-fail-fast
