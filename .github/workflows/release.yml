name: Release

# Cross-compiles the three binaries and attaches them to the GitHub release.
#
# Why all three, always: `stax` locates `stax-server` and `stax-hooks` NEXT TO
# ITS OWN EXECUTABLE. An archive carrying only `stax` reproduces the install bug
# this repo spent a week fixing — `stax start` failing with "No such file or
# directory" while looking for a sibling that was never shipped. The archive is
# the unit of installation, and it holds the whole product.
#
# Trigger: pushing a `v*` tag. Also runnable by hand (workflow_dispatch) so the
# artifacts for an ALREADY-published release can be built without re-tagging.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and upload assets for (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-13
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          # Static musl builds run on ANY Linux — the gnu builds above need
          # glibc >= the build runner's (2.39 on ubuntu-24.04), which killed
          # v1.0.0 on Ubuntu <= 23.10 and Debian 12. install.sh prefers musl
          # and falls back to gnu for old releases; the gnu pair stays for
          # link-compat until the tap and binstall templates flip over.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ${{ matrix.target }}

      # The React bundle is embedded into stax-server at compile time by its
      # build.rs. A checkout builds from the committed dist under
      # rust/assets/static, so no Node step is needed here — but if that ever
      # stops being committed, this is where `npm ci && npm run build` goes.
      - name: build
        run: |
          cd rust
          cargo build --release --locked --target ${{ matrix.target }} \
            --bin stax --bin stax-server --bin stax-hooks

      - name: package
        id: package
        shell: bash
        run: |
          cd rust
          TAG="${{ inputs.tag || github.ref_name }}"
          NAME="staxtrace-${TAG}-${{ matrix.target }}"
          STAGE="$(mktemp -d)/${NAME}"
          mkdir -p "$STAGE"
          cp target/${{ matrix.target }}/release/stax \
             target/${{ matrix.target }}/release/stax-server \
             target/${{ matrix.target }}/release/stax-hooks "$STAGE/"
          cp ../LICENSE ../README.md "$STAGE/" 2>/dev/null || true
          tar -czf "${NAME}.tar.gz" -C "$(dirname "$STAGE")" "$NAME"
          # Checksums are generated next to the archive, one line per file, so
          # `shasum -c` works against the downloaded pair without editing.
          if command -v shasum >/dev/null; then
            shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          else
            sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          fi
          echo "archive=rust/${NAME}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=rust/${NAME}.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      # Smoke-test only what this runner can execute. A cross-built arm64 Linux
      # binary cannot run on an x86 runner, so the check is conditional rather
      # than skipped everywhere — proving the archive is not empty or unlinkable
      # on the three natively-built triples.
      - name: smoke
        if: matrix.target != 'aarch64-unknown-linux-gnu' || runner.arch == 'ARM64'
        run: |
          cd rust
          ./target/${{ matrix.target }}/release/stax --version
          ./target/${{ matrix.target }}/release/stax-hooks 2>&1 | grep -q usage

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}

  # Bump Formula/staxtrace.rb in 0bserver07/homebrew-tap to this release.
  # Needs a TAP_PUSH_TOKEN secret (fine-grained PAT, contents:write on the tap
  # repo). Absent secret = loud skip, never a broken half-push. The formula's
  # Linux URLs still point at the gnu triples; flipping them to musl is a
  # one-time formula edit once a musl-carrying release exists.
  tap-bump:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: bump tap formula
        env:
          TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [ -z "$TAP_PUSH_TOKEN" ]; then
            echo "::notice::TAP_PUSH_TOKEN not set — tap not bumped; update Formula/staxtrace.rb by hand for $TAG"
            exit 0
          fi
          set -euo pipefail
          VERSION="${TAG#v}"
          git clone "https://x-access-token:${TAP_PUSH_TOKEN}@github.com/0bserver07/homebrew-tap.git" tap
          cd tap
          sha_for() {
            curl -fsSL "https://github.com/0bserver07/staxtrace/releases/download/${TAG}/staxtrace-${TAG}-$1.tar.gz.sha256" | awk '{print $1}'
          }
          # Rewrite version, then each triple's sha256 on the line after its url.
          sed -i "s/^  version \".*\"/  version \"${VERSION}\"/" Formula/staxtrace.rb
          for triple in aarch64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            SHA="$(sha_for "$triple")"
            python3 - "$triple" "$SHA" <<'PY'
          import re, sys
          triple, sha = sys.argv[1], sys.argv[2]
          path = "Formula/staxtrace.rb"
          text = open(path).read()
          pattern = re.compile(r'(-%s\.tar\.gz"\n\s+sha256 ")[0-9a-f]{64}(")' % re.escape(triple))
          text, count = pattern.subn(lambda m: m.group(1) + sha + m.group(2), text)
          assert count == 1, f"{triple}: expected exactly one sha line, found {count}"
          open(path, "w").write(text)
          PY
          done
          git config user.name "staxtrace-release"
          git config user.email "release@users.noreply.github.com"
          git commit -am "staxtrace ${VERSION}"
          git push
